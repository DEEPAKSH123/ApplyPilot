# ApplyPilot search configuration for India-based backend roles.
# Copy to APPLYPILOT_DIR/searches.yaml and customize as needed.

queries:
  - query: "backend engineer"
    tier: 1
  - query: "java backend engineer"
    tier: 1
  - query: "golang backend engineer"
    tier: 1
  - query: "software engineer backend"
    tier: 1
  - query: "SDE 1 backend"
    tier: 1
  - query: "SDE 2 backend"
    tier: 1
  - query: "backend developer"
    tier: 2
  - query: "software engineer"
    tier: 2
  - query: "platform engineer"
    tier: 2

locations:
  - location: "Bengaluru, Karnataka, India"
    remote: false
  - location: "Pune, Maharashtra, India"
    remote: false
  - location: "Hyderabad, Telangana, India"
    remote: false
  - location: "India"
    remote: true

location:
  accept_patterns:
    - "Bengaluru"
    - "Bangalore"
    - "Karnataka"
    - "Pune"
    - "Maharashtra"
    - "Hyderabad"
    - "Telangana"
    - "India"
    - "Remote"
    - "Anywhere"
    - "APAC"
  reject_patterns:
    - "United States only"
    - "US only"
    - "USA only"
    - "Canada only"
    - "UK only"
    - "Europe only"
    - "EMEA only"
    - "onsite only"

country: "India"

boards:
  - indeed
  - linkedin
  - glassdoor
  - google

defaults:
  results_per_site: 100
  hours_old: 24

max_posted_days: 10

seniority:
  reject_titles:
    - "senior"
    - "sr."
    - "lead"
    - "tech lead"
    - "staff"
    - "principal"
    - "manager"
    - "director"
    - "architect"
    - "head"

exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "principal scientist"
